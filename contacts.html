<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/contacts.css">
</head>
<body>
    
   <div class="contact-container">
    <!-- Левая панель: Инфо -->
    <div class="contact-info">
        <div class="logo-container">
            <!-- SVG Логотип Mercedes -->
            <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 1.5c4.69 0 8.5 3.81 8.5 8.5 0 1.39-.34 2.7-.93 3.87l-6.72-3.88V4.1c.38-.07.76-.1 1.15-.1zM11.35 4.1v7.89l-6.72 3.88c-.59-1.17-.93-2.48-.93-3.87 0-4.69 3.81-8.5 8.5-8.5.39 0 .77.03 1.15.1zm-7.3 12.57l6.73-3.88v7.76c-3.13-.53-5.69-2.73-6.73-3.88zm8.6 3.88v-7.76l6.73 3.88c-1.04 1.15-3.6 3.35-6.73 3.88z" fill="#ffffff"/>
            </svg>
            <span class="brand-name">Mercedes-Benz</span>
        </div>
        
        <h2>Свяжитесь с нами</h2>
        <p class="subtitle">Мы готовы ответить на любые ваши вопросы о наших автомобилях и сервисе.</p>

        <div class="info-details">
            <div class="info-item">
                <span class="icon">📍</span>
                <p>ул. Мерседес-Бенц, д. 1, Москва, Россия</p>
            </div>
            <div class="info-item">
                <span class="icon">📞</span>
                <p>8 (800) 200-02-02</p>
            </div>
            <div class="info-item">
                <span class="icon">✉️</span>
                <p>info@mercedes-benz.ru</p>
            </div>
        </div>
    </div>

    <!-- Правая панель: Форма -->
    <div class="contact-form-container">
        <form id="contactForm" class="contact-form">
            <div class="input-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" required placeholder="Иван Иванов">
            </div>

            <div class="input-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" required placeholder="example@mail.com">
            </div>

            <div class="input-group">
                <label for="message">Сообщение</label>
                <textarea id="message" rows="5" required placeholder="Введите ваше сообщение..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Отправить запрос</button>
        </form>
        <div id="successMessage" class="success-message hidden">
            <h3>Спасибо!</h3>
            <p>Ваше сообщение успешно отправлено. Наш менеджер свяжется с вами в ближайшее время.</p>
        </div>
    </div>
</div>

    <script src="./js/contacts.js"></script>
</body>
</html>
