<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/contacts.css">
</head>
<body>
    
    <!-- Шапка сайта -->
    <header>
        <nav>
            <div class="logo" style="color: white; font-weight: bold; font-size: 1.5rem;">МойСайт</div>
            <div class="menu">
               
            </div>
        </nav>
    </header>

    <!-- Основной контент страницы контактов -->
    <main class="contact-container">
        
        <!-- Блок с контактными данными -->
        <section class="contact-info">
            <h2>Свяжитесь с нами</h2>
            <p>Мы всегда рады ответить на ваши вопросы. Используйте любые удобные каналы связи или заполните форму.</p>
            
            <div class="contact-method" style="margin-top: 30px;">
                <h3>📍 Адрес</h3>
                <p>ул. Примерная, дом 10, офис 4</p>
            </div>
            
            <div class="contact-method">
                <h3>📞 Телефон</h3>
                <p>+7 (999) 123-45-67</p>
            </div>
            
            <div class="contact-method">
                <h3>✉️ Email</h3>
                <p>info@example.com</p>
            </div>
        </section>

        <!-- Форма обратной связи -->
        <section class="contact-form">
            <h2>Напишите нам</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Ваше имя</label>
                    <input type="text" id="name" name="name" required placeholder="Иван">
                </div>
                
                <div class="form-group">
                    <label for="email">Ваш Email</label>
                    <input type="email" id="email" name="email" required placeholder="ivan@example.com">
                </div>
                
                <div class="form-group">
                    <label for="message">Сообщение</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Введите ваше сообщение..."></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </section>

    </main>

    <!-- Подвал сайта -->
    <footer>
        <p>&copy; 2026 Все права защищены</p>
    </footer>
    <script src="./js/contacts.js"></script>
</body>
</html>
